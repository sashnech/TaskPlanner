<!DOCTYPE html>
<html lang="uk" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактор задач</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<main class="container">

    <header class="page-header">
        <div>
            <h1 th:text="${pageTitle}">Задача</h1>
        </div>
    </header>

    <section class="panel form-panel">

        <form th:action="@{/tasks/save}"
              th:object="${task}"
              method="post">

            <input type="hidden" th:field="*{id}">
            <input type="hidden" th:field="*{completed}">

            <div class="form-group">
                <label for="title">Назва задачі</label>

                <input type="text"
                       id="title"
                       th:field="*{title}"
                       placeholder="Введіть назву задачі"
                       maxlength="120"
                       required>
            </div>

            <div class="form-group">
                <label for="dueDate">Дата виконання</label>

                <input type="date"
                       id="dueDate"
                       th:field="*{dueDate}"
                       required>
            </div>

            <div class="form-group">
                <label for="priority">Пріоритет</label>

                <select id="priority"
                        th:field="*{priority}"
                        required>

                    <option th:each="priority : ${priorities}"
                            th:value="${priority}"
                            th:text="${priority.label}">
                    </option>

                </select>
            </div>

            <div class="form-actions">
                <button class="button primary" type="submit">
                    Зберегти
                </button>

                <a class="button secondary" th:href="@{/tasks}">
                    Скасувати
                </a>
            </div>

        </form>

    </section>

</main>

</body>
</html>
